<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finsage · stock analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230b1d3a'/><path fill='%237aa9ff' fill-rule='evenodd' d='M0 0h1v15h15v1H0V0Zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5Z'/></svg>">
  <style>
    body { background: #f0f4fc; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .card-shadow { box-shadow: 0 12px 28px rgba(0,20,60,.08), 0 2px 8px rgba(0,0,0,.02); border: none; border-radius: 1.25rem; background: #fff; }
    .header-finsage { background: linear-gradient(135deg,#0b1d3a 0%,#122b4e 100%); color:#fff; border-radius:1.5rem 1.5rem 0 0; padding:1.5rem 2rem; }
    .header-finsage h1 { font-weight:600; letter-spacing:-.02em; font-size:2rem; margin:0; display:flex; align-items:center; gap:.65rem; }
    .header-finsage h1 i { color:#7aa9ff; font-size:2rem; }
    .header-finsage .sub { color:#b6c9e8; font-size:.9rem; margin-top:.25rem; }
    .toggle-group { background:#e8eef9; border-radius:3rem; padding:.3rem; display:inline-flex; border:1px solid #cdd9ed; }
    .toggle-btn { border:none; background:transparent; padding:.55rem 1.8rem; border-radius:3rem; font-weight:500; font-size:.95rem; color:#1a2e4f; }
    .toggle-btn.active { background:#0b1d3a; color:#fff; box-shadow:0 4px 10px rgba(11,29,58,.25); }
    .toggle-btn:not(.active):hover { background:#d6e1f5; }
    .input-group-custom { border-radius:3rem; overflow:hidden; border:1px solid #cfdff2; background:#fff; }
    .input-group-custom .form-control { border:none; padding:.75rem 1.25rem; font-size:1rem; }
    .input-group-custom .form-control:focus { box-shadow:none; }
    .input-group-custom .btn { border-radius:3rem; padding:.6rem 2rem; font-weight:500; background:#0b1d3a; color:#fff; border:none; margin:.25rem; }
    .input-group-custom .btn:hover { background:#1a3a6b; }
    .data-box { background:#fff; border-radius:1.25rem; border:1px solid #e3ebf7; padding:1.5rem 1.75rem; }
    .badge-soft-blue { background:#e8f0fe; color:#0b2a5c; font-weight:500; padding:.35rem 1rem; border-radius:3rem; font-size:.8rem; }
    .stat-value { font-weight:600; color:#0b1d3a; }
    .stat-label { font-size:.75rem; text-transform:uppercase; letter-spacing:.03em; color:#5f7a9e; font-weight:500; }
    .section-title { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; font-weight:600; color:#3f5e87; margin-bottom:1rem; border-bottom:2px solid #e6edf8; padding-bottom:.5rem; }
    .soft-alert { background:#f7faff; border-left:4px solid #0b1d3a; border-radius:.75rem; padding:1rem 1.25rem; color:#1e3452; font-size:.9rem; }
    .signal-pill { background:#eaf1fd; padding:.3rem 1rem; border-radius:2rem; color:#0b1d3a; font-weight:500; font-size:.85rem; }
    footer { font-size:.75rem; color:#7e95b0; }
    .loader { display:inline-block; width:1rem; height:1rem; border:2px solid #ffffff70; border-radius:50%; border-top-color:#fff; animation:spin .8s linear infinite; margin-right:.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .placeholder-box { background:#f7faff; border:1px dashed #b9cce8; border-radius:1rem; padding:2.5rem 1rem; text-align:center; color:#6d86a8; }
    .error-box { background:#fff5f5; border:1px solid #f3c2c2; border-left:4px solid #c0392b; border-radius:.75rem; padding:1rem 1.25rem; color:#7a2222; }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
  <div class="container" style="max-width: 1000px;">
    <div class="card card-shadow overflow-hidden">

      <div class="header-finsage">
        <h1><i class="bi bi-graph-up-arrow"></i> Finsage</h1>
        <div class="sub">real‑time equity intelligence · ML powered</div>
      </div>

      <div class="p-4 pb-2 bg-white">
        <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
          <div class="toggle-group">
            <button id="indianBtn" class="toggle-btn active" data-market="IN"><i class="bi bi-currency-rupee me-1"></i> Indian stock</button>
            <button id="usBtn" class="toggle-btn" data-market="US"><i class="bi bi-currency-dollar me-1"></i> US stock</button>
          </div>
        </div>

        <div class="input-group-custom d-flex align-items-center w-100 mb-4">
          <input id="symbolInput" type="text" class="form-control" placeholder="e.g. STLTECH, RELIANCE" aria-label="Stock symbol">
          <button id="fetchBtn" class="btn d-flex align-items-center" type="button"><i class="bi bi-search me-2"></i> Analyse</button>
        </div>
      </div>

      <!-- This is the only place results/errors are rendered -->
      <div class="px-4 pb-4 bg-white">
        <div id="resultArea">
          <!-- initial placeholder (not sample data) -->
          <div class="placeholder-box" id="placeholderBox">
            <i class="bi bi-bar-chart-line fs-2 d-block mb-2"></i>
            Enter a symbol and click <strong>Analyse</strong> to fetch data.
          </div>
        </div>
      </div>

      <div class="px-4 pb-3 pt-2 bg-white d-flex justify-content-between align-items-center">
        <footer><i class="bi bi-database"></i> finsage client</footer>
        <footer id="timestampDisplay"></footer>
      </div>
    </div>
  </div>

  <script>
    // =====================================================================
    // >>> PASTE YOUR API BASE URL HERE <<<
    // e.g. "https://api.yourserver.com"  (no trailing slash)
    // The request will be:  GET  ${API_BASE}/stock/${market}/${symbol}
    // =====================================================================
    const API_BASE = "https://finsage-production.up.railway.app";

    // ---- state ----
    let currentMarket = 'in';
    const indianBtn = document.getElementById('indianBtn');
    const usBtn = document.getElementById('usBtn');
    const symbolInput = document.getElementById('symbolInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const resultArea = document.getElementById('resultArea');
    const timestampDisplay = document.getElementById('timestampDisplay');

    function setMarket(market) {
      currentMarket = market;
      indianBtn.classList.toggle('active', market === 'in');
      usBtn.classList.toggle('active', market === 'us');
      symbolInput.placeholder = market === 'in' ? 'e.g. STLTECH, RELIANCE' : 'e.g. AAPL, MSFT';
    }
    indianBtn.addEventListener('click', () => setMarket('in'));
    usBtn.addEventListener('click', () => setMarket('us'));

    const fmt2 = (n) => (n !== undefined && n !== null && n !== '') ? Number(n).toFixed(2) : '—';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function showPlaceholder() {
      resultArea.innerHTML = `
        <div class="placeholder-box" id="placeholderBox">
          <i class="bi bi-bar-chart-line fs-2 d-block mb-2"></i>
          Enter a symbol and click <strong>Analyse</strong> to fetch data.
        </div>`;
    }

    function showError(message) {
      resultArea.innerHTML = `<div class="error-box"><i class="bi bi-exclamation-octagon me-1"></i> <strong>Error:</strong> ${esc(message)}</div>`;
      timestampDisplay.textContent = '';
    }

    function renderData(data) {
      const ml = data?.ml_prediction || {};
      const latest = ml?.latest_data || {};
      const fusion = data?.fusion_signal || {};
      const agent = data?.agent_analysis || {};

      let vix = '—';
      if (agent.macro_context) {
        const m = agent.macro_context.match(/VIX\s*(?:at|:)?\s*([0-9.]+)/i);
        if (m) vix = m[1];
      }

      resultArea.innerHTML = `
        <div class="data-box">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
            <div>
              <span class="badge-soft-blue me-2">${esc(data?.market ?? currentMarket)}</span>
              <span class="fw-bold fs-5">${esc(data?.symbol ?? symbolInput.value.trim().toUpperCase())}</span>
            </div>
            <div class="signal-pill"><i class="bi bi-activity"></i> ${esc(fusion.recommendation ?? agent.final_recommendation ?? '—')}</div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6 col-md-3"><div class="stat-label">Open</div><div class="stat-value">${fmt2(latest.Open)}</div></div>
            <div class="col-6 col-md-3"><div class="stat-label">High</div><div class="stat-value">${fmt2(latest.High)}</div></div>
            <div class="col-6 col-md-3"><div class="stat-label">Low</div><div class="stat-value">${fmt2(latest.Low)}</div></div>
            <div class="col-6 col-md-3"><div class="stat-label">Close</div><div class="stat-value">${fmt2(latest.Close)}</div></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <div class="section-title"><i class="bi bi-cpu me-1"></i> ML Prediction</div>
              <div class="d-flex flex-wrap gap-3">
                <div><span class="stat-label">Direction</span><br><span class="fw-semibold">${esc(ml.predicted_direction ?? '—')}</span></div>
                <div><span class="stat-label">Confidence</span><br><span class="fw-semibold">${esc(ml.prediction_confidence ?? '—')}</span></div>
                <div><span class="stat-label">Horizon</span><br><span class="fw-semibold">${ml.horizon_days ? ml.horizon_days + ' days' : '—'}</span></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="section-title"><i class="bi bi-pie-chart me-1"></i> Fusion signal</div>
              <div class="d-flex flex-wrap gap-3">
                <div><span class="stat-label">Final prob.</span><br><span class="fw-semibold">${fusion.final_probability !== undefined ? Number(fusion.final_probability).toFixed(4) : '—'}</span></div>
                <div><span class="stat-label">Confidence</span><br><span class="fw-semibold">${fusion.confidence !== undefined ? Number(fusion.confidence).toFixed(4) : '—'}</span></div>
                <div><span class="stat-label">Regime</span><br><span class="fw-semibold">${esc(fusion.regime ?? '—')}</span></div>
              </div>
            </div>
          </div>

          <div class="section-title"><i class="bi bi-robot me-1"></i> Agent analysis</div>
          <div class="soft-alert mb-3">${esc(agent.reasoning ?? 'No reasoning available.')}</div>
          <div class="d-flex flex-wrap gap-3 mb-2 small">
            <span class="badge-soft-blue"><i class="bi bi-bar-chart"></i> Technical: ${esc(agent.technical_signal ?? '—')}</span>
            <span class="badge-soft-blue"><i class="bi bi-newspaper"></i> News: ${esc(agent.news_signal ?? '—')}</span>
            <span class="badge-soft-blue"><i class="bi bi-exclamation-triangle"></i> VIX: ${esc(vix)}</span>
          </div>
          <div class="text-muted small">${esc(agent.risk_flags ?? '')}</div>
        </div>`;

      timestampDisplay.textContent = data?.timestamp ? new Date(data.timestamp).toISOString() : '';
    }

    async function loadStock() {
      const symbol = symbolInput.value.trim().toLowerCase();
      if (!symbol) { showError('Please enter a stock symbol.'); return; }
      if (!API_BASE) { showError('API_BASE is not configured. Set it in the script.'); return; }

      fetchBtn.disabled = true;
      fetchBtn.innerHTML = '<span class="loader"></span> Loading';
      resultArea.innerHTML = `<div class="placeholder-box"><span class="loader" style="border-top-color:#0b1d3a;border-color:#0b1d3a33;border-top-color:#0b1d3a"></span> Fetching ${esc(symbol)}…</div>`;

      const url = `${API_BASE}/stock/${currentMarket}/${encodeURIComponent(symbol)}`;
      try {
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) {
          let detail = `HTTP ${res.status} ${res.statusText}`;
          try { const j = await res.json(); if (j?.detail || j?.message) detail = j.detail || j.message; } catch (_) {}
          throw new Error(detail);
        }
        const data = await res.json();
        renderData(data);
      } catch (err) {
        showError(err.message || 'Failed to fetch stock data.');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '<i class="bi bi-search me-2"></i> Analyse';
      }
    }

    fetchBtn.addEventListener('click', loadStock);
    symbolInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadStock(); });

    // start empty — no sample data
    showPlaceholder();
  </script>
</body>
</html>
